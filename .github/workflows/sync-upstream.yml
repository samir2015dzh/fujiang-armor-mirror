# Mirror of enticingns/fujiang-armor - sync workflow lives on this branch (mirror-admin).
name: Sync upstream mirror

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
    steps:
      - name: Mirror upstream branches and tags
        if: ${{ env.SYNC_TOKEN != '' }}
        run: |
          set -e
          git clone --bare https://github.com/enticingns/fujiang-armor.git upstream.git
          cd upstream.git
          git push "https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/${{ github.repository }}.git" '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

      - name: Sync fork samir2015dzh/fujiang-armor via merge-upstream
        if: ${{ env.SYNC_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          status=$(curl -sS -o resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/samir2015dzh/fujiang-armor/merge-upstream \
            -d '{"branch":"main"}')
          echo "HTTP ${status}"
          cat resp.json
          if [ "${status}" != "200" ]; then
            echo "merge-upstream failed for samir2015dzh/fujiang-armor (main)"
            exit 1
          fi
